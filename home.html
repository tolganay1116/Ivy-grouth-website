<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little World</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fff0f5, #e6f7ef);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 460px;
      padding: 30px 24px;
      text-align: center;
      background: #fffdf8;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(200, 120, 150, 0.2);
    }

    h1 { color: #2f4a3a; margin: 0 0 6px; }
    .subtitle { color: #7a8f82; margin-bottom: 18px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .tile {
      display: block;
      text-align: left;
      padding: 16px;
      border-radius: 18px;
      text-decoration: none;
      color: #2f4a3a;
      transition: transform 0.2s;
    }
    .tile:hover { transform: translateY(-4px); }
    .tile .icon { font-size: 26px; }
    .tile h3 { margin: 8px 0 4px; font-size: 18px; }
    .tile p { margin: 0; font-size: 13px; opacity: 0.7; }

    .mint  { background: #dfeee4; }
    .pink  { background: #ebc9d3; }
    .cream { background: #fcefdc; }
    .sage  { background: #e5e6da; }

    .button {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 999px;
      background: #e8799b;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>My Little World 🌱</h1>
    <p class="subtitle">Your personal growth dashboard</p>

    <div class="grid">
      <a class="tile mint" href="journal.html">
        <span class="icon">📓</span>
        <h3>My Journal</h3>
        <p>Thoughts & memories</p>
      </a>
      <a class="tile pink" href="#">
        <span class="icon">🎓</span>
        <h3>My Study Plan</h3>
        <p>Learn & improve</p>
      </a>
      <a class="tile cream" href="#">
        <span class="icon">🎯</span>
        <h3>My Goals</h3>
        <p>Dream & achieve</p>
      </a>
      <a class="tile sage" href="#">
        <span class="icon">✅</span>
        <h3>Habit Tracker</h3>
        <p>Little daily steps</p>
      </a>
    </div>

    <a class="button" href="index.html">← Back to Start</a>
  </div>
</body>
</html>
